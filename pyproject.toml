[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jieyi"
version = "0.1.0"
description = "A traceable, model-agnostic workflow for long-form scholarly translation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/shengbaiwang/jieyi"
Repository = "https://github.com/shengbaiwang/jieyi"
Issues = "https://github.com/shengbaiwang/jieyi/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
jieyi = "jieyi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
